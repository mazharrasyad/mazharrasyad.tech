# first-party page/click log for the public /stats report. The frontend sends
# a beacon to /hit?p=<path>[&r=<source origin>] on every page view (including
# client-side navigations, which never reach nginx otherwise) and on every
# WhatsApp/email click. Each hit is written as a combined-format line whose
# request is the page, so GoAccess (scripts/stats.sh) can read it directly.
# Only values matching these allowlists are logged; anything else is dropped.
map $arg_p $mazharrasyad_hit_ok {
    "~^/[A-Za-z0-9/._-]{0,200}$" 1;
    default 0;
}
map $arg_r $mazharrasyad_hit_ref {
    "~^https?://[A-Za-z0-9.-]{1,100}/$" $arg_r;
    default "-";
}
log_format mazharrasyad_hits
    '$remote_addr - - [$time_local] "GET $arg_p HTTP/1.1" 200 0 "$mazharrasyad_hit_ref" "$http_user_agent"';

server {
    server_name mazharrasyad.tech;

    access_log /var/log/nginx/mazharrasyad.tech.access.log;
    error_log  /var/log/nginx/mazharrasyad.tech.error.log;

    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json
        application/javascript application/x-javascript application/xml
        application/xml+rss application/manifest+json image/svg+xml
        font/woff2;

    root /opt/mazharrasyad.tech/frontend/build;
    index index.html;
    charset utf-8;

    include /opt/mazharrasyad.tech/nginx/security-headers.conf;

    # Canonical URLs never end in a slash (the prerendered pages are
    # projects.html etc.), so fold /projects/ into /projects.
    rewrite ^/(.+)/$ /$1 permanent;

    # One URL per page, so search engines never see duplicates: /index.html
    # -> / and /x.html -> /x. Matched on $request_uri (the original request,
    # unchanged by the internal x -> x.html rewrite below), so no redirect loop.
    # Legacy /projects-20xx.html URLs are excluded; they get their own redirects.
    if ($request_uri = /index.html) { return 301 /; }
    if ($request_uri ~ ^/(?!projects-20[0-9][0-9]\.html)([^?]+)\.html(?:\?.*)?$) { return 301 /$1; }

    # Legacy static-site URLs -> new SvelteKit routes. Keeps old shared/
    # indexed links working after the migration off flat .html files.
    location = /projects-2018.html { return 301 /projects; }
    location = /projects-2019.html { return 301 /projects; }
    location = /projects-2020.html { return 301 /projects; }
    location = /projects-2021.html { return 301 /projects; }
    location = /projects-2022.html { return 301 /projects; }
    location = /projects-2023.html { return 301 /projects; }
    location = /projects-2024.html { return 301 /projects; }
    location = /projects-2025.html { return 301 /projects; }
    location = /projects-2026.html { return 301 /projects; }

    # Project pages used to be per-year (/projects/2024) and briefly lived at
    # /timeline; they are now grouped by category under /projects.
    location ~ ^/projects/20[0-9][0-9]$ { return 301 /projects; }
    location = /timeline { return 301 /projects; }
    # The services page was /jasa while the site was Indonesian-only; old
    # ads and shared links still point there.
    location = /jasa { return 301 /services; }
    # Government and Company only exist as tabs on /projects.
    location = /projects/government { return 301 /projects; }
    location = /projects/company { return 301 /projects; }
    location = /projects/diklat { return 301 /projects; }
    location = /projects/freelance { return 301 /projects; }

    # Beacon endpoint (see log_format mazharrasyad_hits above).
    location = /hit {
        access_log /var/log/nginx/mazharrasyad.tech.hits.log mazharrasyad_hits if=$mazharrasyad_hit_ok;
        return 204;
    }

    # Public traffic report (aggregates only: no IPs, sources reduced to an
    # origin), regenerated every 10 minutes by mazharrasyad-stats.timer.
    # GoAccess inlines its scripts and styles and compiles its templates with
    # eval, so this location sets its own headers instead of the site-wide
    # hash-based CSP. Logged values are allowlisted and GoAccess escapes them.
    location = /stats {
        access_log off;
        alias /var/lib/mazharrasyad-stats/index.html;
        default_type text/html;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "no-store" always;
        add_header Content-Security-Policy "default-src 'none'; script-src 'unsafe-inline' 'unsafe-eval'; style-src 'unsafe-inline'; img-src data:; font-src data:; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    }

    # Hashed build assets are content-addressed and safe to cache forever.
    location ^~ /_app/immutable/ {
        include /opt/mazharrasyad.tech/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Images, fonts and the CV only change on a full redeploy.
    location ~* \.(png|jpe?g|webp|avif|svg|ico|woff2|pdf)$ {
        include /opt/mazharrasyad.tech/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=86400" always;
        try_files $uri =404;
    }

    # Home page.
    location = / {
        include /opt/mazharrasyad.tech/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # Prerendered pages: /projects -> projects.html. Unknown page paths
    # redirect to the home page (see @notfound). no-cache makes browsers
    # revalidate (cheap 304s) so a redeploy shows up immediately.
    location / {
        include /opt/mazharrasyad.tech/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri.html @notfound;
    }

    # Unknown routes go to the home page with a 302 (temporary, so a page
    # added later at the same path is not shadowed by cached redirects).
    # Anything with a file extension stays a real 404 so a missing asset
    # never answers with HTML.
    location @notfound {
        if ($uri ~ \.[A-Za-z0-9]+$) { return 404; }
        return 302 /;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/mazharrasyad.tech/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/mazharrasyad.tech/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

# www is not the canonical host: redirect straight to the apex over https so
# search engines only ever see one URL per page (avoids duplicate-content
# SEO penalties).
server {
    server_name www.mazharrasyad.tech;
    listen [::]:443 ssl;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/mazharrasyad.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mazharrasyad.tech/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    return 301 https://mazharrasyad.tech$request_uri;
}

server {
    if ($host = mazharrasyad.tech) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = www.mazharrasyad.tech) {
        return 301 https://mazharrasyad.tech$request_uri;
    }

    server_name mazharrasyad.tech www.mazharrasyad.tech;

    listen 80;
    listen [::]:80;
    return 404; # managed by Certbot
}
