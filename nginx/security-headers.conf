# Security headers for mazharrasyad.tech. nginx drops every inherited
# add_header as soon as a location declares its own (e.g. Cache-Control), so the
# vhost includes this file at server level AND in each such location.

# Single canonical host: this is a personal portfolio with no other
# subdomains planned, so HSTS preload/includeSubDomains carries no
# practical blast radius here (unlike shared infra boxes).
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;

# Content-Security-Policy carries this build's inline-<script> sha256 hashes,
# so it is generated by build.sh (scripts/csp-hashes.mjs), not written by hand.
include /opt/mazharrasyad.tech/nginx/csp.conf;
